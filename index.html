<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Organick</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <div class="header__main">
            <div class="logo">
              <img
                src="./imgs/logo.png"
                alt="logo"
                class="logo__img"
                width="39"
                height="56"
              />
              <span class="logo__text">Organick</span>
            </div>
            <nav class="header__nav">
              <ul class="header__menu menu">
                <li class="menu__item">
                  <a href="#" class="menu__link">Home</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">About</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Pages</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Shop</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Projects</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">News</a>
                </li>
              </ul>
            </nav>
          </div>

          <div class="header__user-bar user-bar">
            <!-- <form action="/search" method="get" class="user-bar__search"> -->
            <form action="" method="" class="user-bar__search">
              <input class="user-bar__input-search" type="text" name="q" />
              <button class="user-bar__btn-search" type="submit"></button>
            </form>
            <button
              type="button"
              aria-label="Открыть корзину"
              class="user-bar__cart"
            >
              Cart (<span>0</span>)
            </button>
          </div>
        </div>
      </header>
    </div>
    <main class="main"></main>
    <footer class="footer"></footer>
  </body>
</html>
